name: Deploy to Azure
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: ${{ vars.APP_NAME }}
  REGISTRY_NAME: ${{ vars.APP_NAME }}registry
  REGISTRY: ${{ vars.APP_NAME }}registry.azurecr.io
  API_IMAGE: ${{ vars.APP_NAME }}registry.azurecr.io/${{ vars.IMAGE_API_REPOSITORY }}
  QUEUE_LISTENER_IMAGE: ${{ vars.APP_NAME }}registry.azurecr.io/${{ vars.IMAGE_QUEUE_LISTENER_REPOSITORY }}

jobs:
  build-images:
    name: Build Docker Images
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Azure CLI Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          auth-type: IDENTITY
          enable-AzPSSession: true

      - name: Login to Azure Container Registry
        run: az acr login --name "$REGISTRY_NAME"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push API
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ github.sha }}
            ${{ env.API_IMAGE }}:latest

      - name: Build and push Queue Listener
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./queue-listener/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.QUEUE_LISTENER_IMAGE }}:${{ github.sha }}
            ${{ env.QUEUE_LISTENER_IMAGE }}:latest

  deploy:
    name: Deploy to Azure
    needs: build-images
    runs-on: ubuntu-24.04

    steps:
      - name: Azure CLI Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          auth-type: IDENTITY
          enable-AzPSSession: true

      - name: Deploy API
        run: |
          az containerapp update \
            --resource-group "$RESOURCE_GROUP" \
            --name "${{ vars.APP_NAME }}api" \
            --image "$API_IMAGE:${{ github.sha }}"

      - name: Deploy Queue Listener
        run: |
          az containerapp update \
            --resource-group "$RESOURCE_GROUP" \
            --name "${{ vars.APP_NAME }}worker" \
            --image "$QUEUE_LISTENER_IMAGE:${{ github.sha }}"
